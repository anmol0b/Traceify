name: Keep demo warm

# Render's free tier sleeps after ~15 min idle; ping the backend so the live demo responds quickly.
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://traceify-nfj4.onrender.com/api/health
