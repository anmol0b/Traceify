name: Evals

# Answer-quality evals call Groq, so they run on demand rather than on every push.
on:
  workflow_dispatch:
    inputs:
      judge:
        description: "Score answers with the LLM judge"
        type: boolean
        default: true
      min_pass_rate:
        description: "Fail the run below this pass rate (0-1)"
        default: "0.8"

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Run evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.run ${{ inputs.judge && '--judge' || '' }} --min-pass-rate ${{ inputs.min_pass_rate }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: backend/evals/results/
